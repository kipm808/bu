name: Rust CI & Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*' # Triggers on tags starting with v (e.g., v0.1.0)
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Static Binary
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache Cargo dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Tests
        run: cargo test --verbose

      - name: Build Static Binary
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Prepare Binary
        run: |
          cd target/x86_64-unknown-linux-musl/release/
          strip bu
          # Create a checksum for security-conscious users
          sha256sum bu > bu.sha256

      - name: Upload Artifact (Internal)
        uses: actions/upload-artifact@v4
        with:
          name: bu-linux-static
          path: target/x86_64-unknown-linux-musl/release/bu

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            target/x86_64-unknown-linux-musl/release/bu
            target/x86_64-unknown-linux-musl/release/bu.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
